name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'meeting-bingo/package.json'
      - 'meeting-bingo/package-lock.json'
  pull_request:
    paths:
      - 'meeting-bingo/package.json'
      - 'meeting-bingo/package-lock.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meeting-bingo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meeting-bingo/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
